services:
  app:
    build: .
    image: concentration-summary-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
